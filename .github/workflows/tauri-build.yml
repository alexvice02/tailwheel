name: Release
on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: tauri-action (main)
        if: github.ref_name == 'main'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId:
          tagName: tailwheel-v__VERSION__
          releaseName: 'tailwheel v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          releaseCommitish:
          projectPath: .
          uploadUpdaterJson: true
          updaterJsonPreferNsis: false
          tauriScript:
          args:
          retryAttempts: 2
          owner: alexvice02
          repo:
          githubBaseUrl:
          releaseAssetNamePattern:
          uploadPlainBinary: false
          uploadWorkflowArtifacts: false
          workflowArtifactNamePattern:
          uploadUpdaterSignatures: true
          generateReleaseNotes: false
          mobile:

      - name: tauri-action (develop)
        if: github.ref_name == 'develop'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId:
          tagName: tailwheel-dev-v__VERSION__
          releaseName: 'tailwheel dev v__VERSION__'
          releaseBody: 'branch for app testing'
          releaseDraft: true
          prerelease: true
          releaseCommitish:
          projectPath: .
          uploadUpdaterJson: true
          updaterJsonPreferNsis: false
          tauriScript:
          args:
          retryAttempts: 2
          owner: alexvice02
          repo:
          githubBaseUrl:
          releaseAssetNamePattern:
          uploadPlainBinary: false
          uploadWorkflowArtifacts: false
          workflowArtifactNamePattern:
          uploadUpdaterSignatures: true
          generateReleaseNotes: false
          mobile:
