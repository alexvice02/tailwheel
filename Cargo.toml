[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/taildrop-core",
    "crates/taildrop-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
wait-timeout = "0.2"
